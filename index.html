<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tool Tracker — Scan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --blue: #1E4D8C;
    --blue-mid: #2E6DB4;
    --green: #1E6B3C;
    --grey: #595959;
    --light: #F2F2F2;
    --white: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--light);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 430px;
    margin: 0 auto;
  }
  header {
    width: 100%;
    background: var(--blue);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 12px rgba(30,77,140,0.3);
  }
  header .icon {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  header h1 { color: white; font-size: 20px; font-weight: 700; }
  header p { color: rgba(255,255,255,0.7); font-size: 12px; margin-top: 1px; }
  main {
    width: 100%;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1;
  }
  #reader {
    width: 100% !important;
    border-radius: 16px;
    overflow: hidden;
    border: none !important;
    box-shadow: 0 4px 24px rgba(0,0,0,0.15);
  }
  /* Override html5-qrcode default styles */
  #reader video { border-radius: 16px !important; }
  #reader img { display: none !important; }
  #reader__scan_region { border-radius: 16px !important; }
  #reader__dashboard { 
    background: white !important;
    border-radius: 0 0 16px 16px !important;
    padding: 12px !important;
  }
  #reader__dashboard_section_csr button {
    background: var(--blue) !important;
    color: white !important;
    border: none !important;
    border-radius: 8px !important;
    padding: 10px 20px !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    cursor: pointer !important;
    width: 100% !important;
  }
  #reader__camera_selection {
    width: 100% !important;
    padding: 8px !important;
    border: 2px solid #e0e0e0 !important;
    border-radius: 8px !important;
    margin-bottom: 8px !important;
    font-size: 14px !important;
  }
  .status-bar {
    background: white;
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #ccc;
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.active { background: #00cc66; box-shadow: 0 0 6px #00cc66; }
  .status-dot.success { background: var(--green); }
  .status-dot.error { background: #cc0000; }
  .status-text { font-size: 14px; color: var(--grey); }
  .result-card {
    display: none;
    background: white;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    border-left: 4px solid var(--green);
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .result-card .label {
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--grey); margin-bottom: 4px;
  }
  .result-card .value { font-size: 20px; font-weight: 700; color: var(--blue); }
  .open-btn {
    display: none;
    width: 100%;
    padding: 18px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(30,107,60,0.3);
    font-family: inherit;
    animation: pulse 1.5s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 4px 16px rgba(30,107,60,0.3); }
    50%       { box-shadow: 0 4px 28px rgba(30,107,60,0.55); }
  }
  .manual-section {
    background: white;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .manual-section h3 {
    font-size: 12px; font-weight: 600;
    color: var(--grey); text-transform: uppercase;
    letter-spacing: 0.6px; margin-bottom: 10px;
  }
  .input-row { display: flex; gap: 8px; }
  .manual-section input {
    flex: 1; padding: 12px 14px;
    border: 2px solid #e0e0e0; border-radius: 10px;
    font-size: 16px; font-family: inherit; outline: none;
    transition: border-color 0.2s;
  }
  .manual-section input:focus { border-color: var(--blue-mid); }
  .manual-section button {
    padding: 12px 18px; background: var(--blue);
    color: white; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: inherit;
  }
  .tip {
    text-align: center; font-size: 12px;
    color: #aaa; padding: 0 8px 16px;
  }
</style>
</head>
<body>

<header>
  <div class="icon">🔧</div>
  <div>
    <h1>Tool Tracker</h1>
    <p>Barcode Scanner</p>
  </div>
</header>

<main>

  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <div class="status-text" id="statusText">Starting camera...</div>
  </div>

  <div id="reader"></div>

  <div class="result-card" id="resultCard">
    <div class="label">Scanned Barcode</div>
    <div class="value" id="resultValue">—</div>
  </div>

  <button class="open-btn" id="openBtn" onclick="openApp()">
    ✔ &nbsp;Open in Tool Tracker
  </button>

  <div class="manual-section">
    <h3>Manual Entry</h3>
    <div class="input-row">
      <input type="text" id="manualInput" placeholder="e.g. TOOL-001"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"/>
      <button onclick="manualSearch()">Go</button>
    </div>
  </div>

  <p class="tip">Works with QR codes, Code 128, Code 39 and most barcode formats</p>

</main>

<script>
  const POWER_APP_URL = "https://apps.powerapps.com/play/e/default-ec445a2a-b5ba-46f6-bead-4595e9fbd4a2/a/d5c29fdc-a19f-4c72-bca6-beedccee8d8c?tenantId=ec445a2a-b5ba-46f6-bead-4595e9fbd4a2&hint=0ab7a361-ee6b-4646-9cbf-889f813f2b6b&sourcetime=1779762545109";

  let scannedValue = null;
  let html5QrCode = null;

  function setStatus(text, state) {
    document.getElementById('statusText').textContent = text;
    const dot = document.getElementById('statusDot');
    dot.className = 'status-dot' + (state ? ' ' + state : '');
  }

  async function startScanner() {
    html5QrCode = new Html5Qrcode("reader");

    const config = {
      fps: 10,
      qrbox: { width: 250, height: 250 },
      aspectRatio: 1.0,
      showTorchButtonIfSupported: true,
      showZoomSliderIfSupported: true,
      defaultZoomValueIfSupported: 1.5
    };

    try {
      // Try rear camera first
      await html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        onScanFailure
      );
      setStatus('Aim at a barcode or QR code', 'active');
    } catch (err) {
      // Fall back to any camera
      try {
        await html5QrCode.start(
          { facingMode: "user" },
          config,
          onScanSuccess,
          onScanFailure
        );
        setStatus('Camera ready — aim at barcode', 'active');
      } catch (err2) {
        setStatus('Camera unavailable — use manual entry', 'error');
        console.error(err2);
      }
    }
  }

  function onScanSuccess(decodedText) {
    if (scannedValue) return; // prevent double scan
    scannedValue = decodedText.trim();

    // Stop scanner
    if (html5QrCode) html5QrCode.stop();

    // Vibrate
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

    setStatus('✔ Barcode detected: ' + scannedValue, 'success');

    // Show result
    document.getElementById('resultCard').style.display = 'block';
    document.getElementById('resultValue').textContent = scannedValue;
    document.getElementById('openBtn').style.display = 'block';

    // Auto open after 1.5 seconds
    setTimeout(openApp, 1500);
  }

  function onScanFailure(error) {
    // Silent — fires constantly while scanning, only log real errors
  }

  function openApp() {
    if (!scannedValue) return;
    const url = POWER_APP_URL + '&barcode=' + encodeURIComponent(scannedValue);
    window.location.href = url;
  }

  function manualSearch() {
    const val = document.getElementById('manualInput').value.trim();
    if (!val) { document.getElementById('manualInput').focus(); return; }
    onScanSuccess(val);
  }

  document.getElementById('manualInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') manualSearch();
  });

  // Start on load
  window.addEventListener('load', () => setTimeout(startScanner, 300));
</script>
</body>
</html>
