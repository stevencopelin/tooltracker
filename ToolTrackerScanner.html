<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tool Tracker — Scan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/zxing-js/0.18.6/index.min.js"></script>
<style>
  :root {
    --blue: #1E4D8C;
    --blue-mid: #2E6DB4;
    --orange: #C55A00;
    --green: #1E6B3C;
    --red: #A50000;
    --grey: #595959;
    --light: #F2F2F2;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--light);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 430px;
    margin: 0 auto;
    overflow-x: hidden;
  }

  /* HEADER */
  header {
    width: 100%;
    background: var(--blue);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 12px rgba(30,77,140,0.3);
  }
  header .icon {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.15);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  header h1 {
    color: white;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  header p {
    color: rgba(255,255,255,0.7);
    font-size: 12px;
    margin-top: 1px;
  }

  /* MAIN */
  main {
    width: 100%;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    flex: 1;
  }

  /* SCANNER BOX */
  .scanner-wrap {
    width: 100%;
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: #111;
    box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    aspect-ratio: 1;
  }

  #preview {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Scanning overlay */
  .scan-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .scan-frame {
    width: 65%;
    aspect-ratio: 1;
    position: relative;
  }
  .scan-frame::before, .scan-frame::after,
  .scan-frame span::before, .scan-frame span::after {
    content: '';
    position: absolute;
    width: 24px; height: 24px;
    border-color: white;
    border-style: solid;
    opacity: 0.9;
  }
  .scan-frame::before { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
  .scan-frame::after  { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
  .scan-frame span::before { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
  .scan-frame span::after  { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }

  /* Scan line animation */
  .scan-line {
    position: absolute;
    left: 5%; right: 5%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00ff88, transparent);
    top: 10%;
    animation: scanline 2s ease-in-out infinite;
    box-shadow: 0 0 8px #00ff88;
  }
  @keyframes scanline {
    0%   { top: 10%; opacity: 1; }
    50%  { top: 85%; opacity: 1; }
    100% { top: 10%; opacity: 1; }
  }

  /* Status bar over camera */
  .cam-status {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
    color: white;
    text-align: center;
    padding: 20px 12px 12px;
    font-size: 13px;
    letter-spacing: 0.2px;
  }

  /* RESULT CARD */
  .result-card {
    display: none;
    background: white;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    border-left: 4px solid var(--green);
    animation: slideUp 0.3s ease;
  }
  .result-card.error { border-left-color: var(--red); }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .result-card .label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--grey);
    margin-bottom: 4px;
  }
  .result-card .value {
    font-size: 18px;
    font-weight: 700;
    color: var(--blue);
  }
  .result-card .sub {
    font-size: 13px;
    color: var(--grey);
    margin-top: 4px;
  }

  /* MANUAL INPUT */
  .manual-section {
    background: white;
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  .manual-section h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--grey);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 10px;
  }
  .input-row {
    display: flex;
    gap: 8px;
  }
  .manual-section input {
    flex: 1;
    padding: 12px 14px;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
    color: #333;
  }
  .manual-section input:focus {
    border-color: var(--blue-mid);
  }
  .manual-section button {
    padding: 12px 18px;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    white-space: nowrap;
  }
  .manual-section button:active {
    background: var(--blue-mid);
    transform: scale(0.97);
  }

  /* OPEN APP BUTTON */
  .open-btn {
    display: none;
    width: 100%;
    padding: 18px;
    background: var(--green);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 4px 16px rgba(30,107,60,0.3);
    animation: pulse 1.5s ease infinite;
    transition: transform 0.1s;
    font-family: inherit;
  }
  .open-btn:active { transform: scale(0.98); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 4px 16px rgba(30,107,60,0.3); }
    50%       { box-shadow: 0 4px 24px rgba(30,107,60,0.55); }
  }

  /* LOADING */
  .loading {
    display: none;
    text-align: center;
    padding: 12px;
    color: var(--grey);
    font-size: 14px;
  }
  .spinner {
    display: inline-block;
    width: 20px; height: 20px;
    border: 3px solid #ddd;
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* CAMERA START BUTTON */
  .start-btn {
    width: 100%;
    padding: 16px;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s, transform 0.1s;
    box-shadow: 0 4px 16px rgba(30,77,140,0.3);
  }
  .start-btn:active { transform: scale(0.98); }

  .tip {
    text-align: center;
    font-size: 12px;
    color: #999;
    padding: 0 8px;
  }
</style>
</head>
<body>

<header>
  <div class="icon">🔧</div>
  <div>
    <h1>Tool Tracker</h1>
    <p>Barcode Scanner</p>
  </div>
</header>

<main>

  <!-- Camera viewfinder -->
  <div class="scanner-wrap" id="scannerWrap">
    <video id="preview" playsinline autoplay muted></video>
    <div class="scan-overlay">
      <div class="scan-frame">
        <span></span>
        <div class="scan-line" id="scanLine"></div>
      </div>
    </div>
    <div class="cam-status" id="camStatus">Initialising camera...</div>
  </div>

  <!-- Start camera button (shown before camera starts) -->
  <button class="start-btn" id="startBtn" onclick="startCamera()">
    📷 &nbsp;Start Camera Scanner
  </button>

  <!-- Loading indicator -->
  <div class="loading" id="loading">
    <span class="spinner"></span> Looking up tool...
  </div>

  <!-- Result card -->
  <div class="result-card" id="resultCard">
    <div class="label">Scanned Barcode</div>
    <div class="value" id="resultValue">—</div>
    <div class="sub" id="resultSub">Opening Tool Tracker...</div>
  </div>

  <!-- Open app button -->
  <button class="open-btn" id="openBtn" onclick="openApp()">
    ✔ &nbsp;Open in Tool Tracker
  </button>

  <!-- Manual entry fallback -->
  <div class="manual-section">
    <h3>Manual Entry</h3>
    <div class="input-row">
      <input type="text" id="manualInput" placeholder="e.g. TOOL-001" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
      <button onclick="manualSearch()">Go</button>
    </div>
  </div>

  <p class="tip">Point the camera at any QR code or barcode on a tool label</p>

</main>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────────────────
  const POWER_APP_URL = "https://apps.powerapps.com/play/e/default-ec445a2a-b5ba-46f6-bead-4595e9fbd4a2/a/d5c29fdc-a19f-4c72-bca6-beedccee8d8c?tenantId=ec445a2a-b5ba-46f6-bead-4595e9fbd4a2&hint=0ab7a361-ee6b-4646-9cbf-889f813f2b6b&sourcetime=1779762545109";

  let scannedValue = null;
  let codeReader = null;
  let scanning = false;

  // ── CAMERA START ────────────────────────────────────────────────────────────
  async function startCamera() {
    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('camStatus').textContent = 'Starting camera...';

    try {
      const hints = new Map();
      const formats = [
        ZXing.BarcodeFormat.QR_CODE,
        ZXing.BarcodeFormat.CODE_128,
        ZXing.BarcodeFormat.CODE_39,
        ZXing.BarcodeFormat.EAN_13,
        ZXing.BarcodeFormat.EAN_8,
        ZXing.BarcodeFormat.DATA_MATRIX,
        ZXing.BarcodeFormat.PDF_417
      ];
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, formats);

      codeReader = new ZXing.BrowserMultiFormatReader(hints);

      const devices = await ZXing.BrowserCodeReader.listVideoInputDevices();

      // Prefer rear camera on mobile
      let deviceId = undefined;
      if (devices.length > 1) {
        const rear = devices.find(d =>
          d.label.toLowerCase().includes('back') ||
          d.label.toLowerCase().includes('rear') ||
          d.label.toLowerCase().includes('environment')
        );
        if (rear) deviceId = rear.deviceId;
      }

      document.getElementById('camStatus').textContent = 'Aim at a barcode or QR code';
      scanning = true;

      await codeReader.decodeFromVideoDevice(
        deviceId,
        'preview',
        (result, err) => {
          if (result && scanning) {
            scanning = false;
            onScanned(result.getText());
          }
        }
      );

    } catch (err) {
      document.getElementById('camStatus').textContent = 'Camera unavailable — use manual entry below';
      console.error(err);
    }
  }

  // ── ON SCAN SUCCESS ─────────────────────────────────────────────────────────
  function onScanned(value) {
    scannedValue = value.trim();

    // Vibrate on scan if supported
    if (navigator.vibrate) navigator.vibrate(100);

    // Stop scan line animation
    document.getElementById('scanLine').style.animationPlayState = 'paused';
    document.getElementById('camStatus').textContent = '✔ Barcode detected!';

    // Show result card
    const card = document.getElementById('resultCard');
    card.style.display = 'block';
    document.getElementById('resultValue').textContent = scannedValue;
    document.getElementById('resultSub').textContent = 'Tap the button below to open Tool Tracker';

    // Show open button
    document.getElementById('openBtn').style.display = 'block';

    // Auto open after short delay
    setTimeout(() => openApp(), 1200);
  }

  // ── OPEN POWER APP ──────────────────────────────────────────────────────────
  function openApp() {
    if (!scannedValue) return;

    document.getElementById('loading').style.display = 'block';
    document.getElementById('openBtn').style.display = 'none';

    const url = POWER_APP_URL + '&barcode=' + encodeURIComponent(scannedValue);
    window.location.href = url;
  }

  // ── MANUAL ENTRY ─────────────────────────────────────────────────────────────
  function manualSearch() {
    const val = document.getElementById('manualInput').value.trim();
    if (!val) {
      document.getElementById('manualInput').focus();
      return;
    }
    scannedValue = val;
    onScanned(val);
  }

  // Allow Enter key on manual input
  document.getElementById('manualInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') manualSearch();
  });

  // Auto-start camera on load
  window.addEventListener('load', () => {
    // Small delay to let page render
    setTimeout(startCamera, 500);
  });
</script>

</body>
</html>
